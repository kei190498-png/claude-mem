name: Voice Workflow

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  voice-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check memory script
        run: python -m py_compile ai_studio/memory.py
